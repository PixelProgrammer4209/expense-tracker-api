<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker — Personal Finance Dashboard</title>
    <meta name="description" content="Track and manage your personal expenses with a sleek, modern dashboard.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        surface: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 700: '#334155', 800: '#1e293b', 900: '#0f172a', 950: '#020617' },
                        accent: { DEFAULT: '#6366f1', light: '#818cf8', dark: '#4f46e5' },
                        emerald: { DEFAULT: '#10b981', light: '#34d399' },
                        amber: { DEFAULT: '#f59e0b', light: '#fbbf24' },
                        rose: { DEFAULT: '#f43f5e', light: '#fb7185' },
                        cyan: { DEFAULT: '#06b6d4', light: '#22d3ee' },
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); min-height: 100vh; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(99, 102, 241, 0.1); }
        .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(99, 102, 241, 0.15); }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .btn-glow:hover { box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }
        input, select { transition: border-color 0.2s ease, box-shadow 0.2s ease; }
        input:focus, select:focus { box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        .skeleton { background: linear-gradient(90deg, rgba(51,65,85,0.4) 25%, rgba(51,65,85,0.7) 50%, rgba(51,65,85,0.4) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="text-slate-200 antialiased">

    <!-- Header -->
    <header class="border-b border-slate-800/50 py-5">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-accent to-accent-dark flex items-center justify-center text-white font-bold text-sm shadow-lg shadow-accent/20">₹</div>
                <h1 class="text-xl font-semibold tracking-tight text-white">ExpenseFlow</h1>
            </div>
            <span id="header-total" class="text-sm text-slate-400 font-medium"></span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 space-y-8">

        <!-- Summary Dashboard -->
        <section id="summary-section" aria-label="Category Summary">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-widest mb-4">Spending by Category</h2>
            <div id="summary-cards" class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <!-- Cards rendered by JS -->
            </div>
        </section>

        <!-- Two-column layout: Form + Feed -->
        <div class="grid lg:grid-cols-5 gap-8">

            <!-- Add Expense Form -->
            <section class="lg:col-span-2">
                <div class="glass rounded-2xl p-6 sticky top-8">
                    <h2 class="text-lg font-semibold text-white mb-5">Add Expense</h2>
                    <form id="expense-form" class="space-y-4">
                        <div>
                            <label for="title" class="block text-xs font-medium text-slate-400 mb-1.5">Title</label>
                            <input type="text" id="title" name="title" required placeholder="e.g. Coffee" class="w-full bg-surface-900/80 border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-accent">
                        </div>
                        <div>
                            <label for="amount" class="block text-xs font-medium text-slate-400 mb-1.5">Amount (₹)</label>
                            <input type="number" id="amount" name="amount" required min="0" step="0.01" placeholder="0.00" class="w-full bg-surface-900/80 border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-accent">
                        </div>
                        <div>
                            <label for="category" class="block text-xs font-medium text-slate-400 mb-1.5">Category</label>
                            <select id="category" name="category" required class="w-full bg-surface-900/80 border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-accent appearance-none cursor-pointer">
                                <option value="" disabled selected>Select category</option>
                                <option value="Food & Beverage">Food & Beverage</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Electronics">Electronics</option>
                            </select>
                        </div>
                        <div>
                            <label for="date" class="block text-xs font-medium text-slate-400 mb-1.5">Date</label>
                            <input type="date" id="date" name="date" required class="w-full bg-surface-900/80 border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-accent">
                        </div>
                        <button type="submit" id="submit-btn" class="w-full mt-2 bg-gradient-to-r from-accent to-accent-dark text-white font-semibold text-sm py-3 rounded-xl btn-glow transition-all duration-200 hover:opacity-90 active:scale-[0.98]">
                            Add Expense
                        </button>
                    </form>
                    <p id="form-msg" class="text-xs mt-3 text-center hidden"></p>
                </div>
            </section>

            <!-- Expense Feed -->
            <section class="lg:col-span-3">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-widest">Recent Expenses</h2>
                    <span id="expense-count" class="text-xs text-slate-500"></span>
                </div>
                <div id="expense-list" class="space-y-3">
                    <!-- Expenses rendered by JS -->
                </div>
                <p id="empty-state" class="hidden text-center text-slate-500 text-sm py-16">No expenses yet. Add one to get started!</p>
            </section>
        </div>
    </main>

    <!-- Toast container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 space-y-2"></div>

    <script>
        const API = 'https://expense-tracker-api-ytkj.onrender.com/';

        const CATEGORY_META = {
            'Food & Beverage': { icon: '🍽️', gradient: 'from-amber-500/20 to-amber-600/5', text: 'text-amber-400', border: 'border-amber-500/20' },
            'Utilities':       { icon: '⚡', gradient: 'from-cyan-500/20 to-cyan-600/5',   text: 'text-cyan-400',  border: 'border-cyan-500/20' },
            'Entertainment':   { icon: '🎬', gradient: 'from-rose-500/20 to-rose-600/5',   text: 'text-rose-400',  border: 'border-rose-500/20' },
            'Electronics':     { icon: '💻', gradient: 'from-indigo-500/20 to-indigo-600/5', text: 'text-indigo-400', border: 'border-indigo-500/20' },
        };

        // ——— Toast notification ———
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-500/90' : 'bg-rose-500/90';
            toast.className = `${bg} text-white text-sm px-5 py-3 rounded-xl shadow-lg backdrop-blur fade-in font-medium`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // ——— Fetch & Render Summary ———
        async function loadSummary() {
            const container = document.getElementById('summary-cards');
            try {
                const res = await fetch(`${API}/summary`);
                const data = await res.json();
                const allCategories = ['Food & Beverage', 'Utilities', 'Entertainment', 'Electronics'];
                const summaryMap = {};
                data.forEach(item => summaryMap[item._id] = item.totalSpent);

                let totalAll = 0;
                container.innerHTML = allCategories.map(cat => {
                    const spent = summaryMap[cat] || 0;
                    totalAll += spent;
                    const meta = CATEGORY_META[cat];
                    return `
                        <div class="glass rounded-2xl p-5 card-hover fade-in border ${meta.border}">
                            <div class="flex items-center gap-2 mb-3">
                                <span class="text-lg">${meta.icon}</span>
                                <span class="text-xs font-medium text-slate-400">${cat}</span>
                            </div>
                            <p class="text-2xl font-bold ${meta.text}">₹${spent.toLocaleString('en-IN', { minimumFractionDigits: 0 })}</p>
                        </div>`;
                }).join('');

                document.getElementById('header-total').textContent = `Total: ₹${totalAll.toLocaleString('en-IN')}`;
            } catch (err) {
                container.innerHTML = '<p class="text-rose-400 text-sm col-span-full">Failed to load summary.</p>';
            }
        }

        // ——— Fetch & Render Expenses ———
        async function loadExpenses() {
            const container = document.getElementById('expense-list');
            const empty = document.getElementById('empty-state');
            const countEl = document.getElementById('expense-count');
            try {
                const res = await fetch(API);
                const expenses = await res.json();

                if (!expenses.length) {
                    container.innerHTML = '';
                    empty.classList.remove('hidden');
                    countEl.textContent = '';
                    return;
                }
                empty.classList.add('hidden');
                countEl.textContent = `${expenses.length} item${expenses.length > 1 ? 's' : ''}`;

                expenses.sort((a, b) => new Date(b.date) - new Date(a.date));

                container.innerHTML = expenses.map(exp => {
                    const meta = CATEGORY_META[exp.category] || CATEGORY_META['Utilities'];
                    const d = new Date(exp.date);
                    const dateStr = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
                    return `
                        <div class="glass rounded-xl px-5 py-4 flex items-center justify-between gap-4 card-hover fade-in group" data-id="${exp._id}">
                            <div class="flex items-center gap-4 min-w-0">
                                <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${meta.gradient} flex items-center justify-center text-base shrink-0 border ${meta.border}">${meta.icon}</div>
                                <div class="min-w-0">
                                    <p class="text-sm font-semibold text-white truncate">${escapeHtml(exp.title)}</p>
                                    <p class="text-xs text-slate-500 mt-0.5">${exp.category} · ${dateStr}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-4 shrink-0">
                                <span class="text-base font-bold ${meta.text}">₹${Number(exp.amount).toLocaleString('en-IN')}</span>
                                <button onclick="deleteExpense('${exp._id}')" title="Delete" class="opacity-0 group-hover:opacity-100 transition-opacity p-1.5 rounded-lg hover:bg-rose-500/20 text-slate-500 hover:text-rose-400">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                </button>
                            </div>
                        </div>`;
                }).join('');
            } catch (err) {
                container.innerHTML = '<p class="text-rose-400 text-sm">Failed to load expenses. Is the server running?</p>';
            }
        }

        // ——— Add Expense ———
        document.getElementById('expense-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.textContent = 'Saving…';

            const payload = {
                title: document.getElementById('title').value.trim(),
                amount: parseFloat(document.getElementById('amount').value),
                category: document.getElementById('category').value,
                date: document.getElementById('date').value,
            };

            try {
                const res = await fetch(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                if (!res.ok) throw new Error('Failed');
                document.getElementById('expense-form').reset();
                showToast('Expense added!');
                await Promise.all([loadExpenses(), loadSummary()]);
            } catch (err) {
                showToast('Failed to add expense.', 'error');
            } finally {
                btn.disabled = false; btn.textContent = 'Add Expense';
            }
        });

        // ——— Delete Expense ———
        async function deleteExpense(id) {
            try {
                const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Failed');
                showToast('Expense deleted.');
                await Promise.all([loadExpenses(), loadSummary()]);
            } catch (err) {
                showToast('Failed to delete.', 'error');
            }
        }

        // ——— Utility ———
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ——— Init ———
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('date').valueAsDate = new Date();
            loadSummary();
            loadExpenses();
        });
    </script>
</body>
</html>
